<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/graph.css') }}" />
  </head>
  <body>
    <header>
      <h1>Graph Viewer</h1>
      <p class="status">Loading graph from the /extract endpoint...</p>
    </header>
    <main>
      <div id="graph"></div>
      <aside class="sidebar">
        <h2 id="sidebar-title">No node selected</h2>
        <div id="node-details"><p>Select a node to view details.</p></div>
      </aside>
    </main>

    <script src="https://unpkg.com/cytoscape@3.4.0/dist/cytoscape.min.js"></script>
    <script>
      const status = document.querySelector('.status');
      const sidebarTitle = document.getElementById('sidebar-title');
      const details = document.getElementById('node-details');

      const BASE_NODE_SIZE = 10;

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderEntityDetails(node) {
        const data = node.data();

        const aliasNodes = node.connectedEdges('edge[edge_type="alias"]');
        const aliasCount = aliasNodes.length;
        sidebarTitle.textContent =
          data.label
          + ` (${aliasCount} alias${aliasCount !== 1 ? 'es' : ''})`;
        details.innerHTML = '<p>No occurrences available.</p>';
      }

      function renderAliasDetails(node) {
        const data = node.data();
        const occurrences = Array.isArray(data.occurrences) ? data.occurrences : [];

        sidebarTitle.textContent =
          data.label
          + ` (${occurrences.length} occurrence${occurrences.length !== 1 ? 's' : ''})`;

        if (occurrences.length === 0) {
          details.innerHTML = '<p>No occurrences available.</p>';
        }
        else {
          details.innerHTML = occurrences.map(item => {
            const link = escapeHtml(item.link);
            const context = item.context;
            return `
              <section>
                <p><a href="${link}" target="_blank" rel="noopener noreferrer">View on GOV.UK</a></p>
                <p>${context}</p>
              </section>
            `;
          }).join('');
        }
      }

      function renderNodeDetails(node) {
        const data = node.data();
        if (data.type === 'entity') {
          renderEntityDetails(node);
        }
        else if (data.type === 'alias') {
          renderAliasDetails(node);
        }
      }

      function calculateEntityNodeSize(node) {
        const data = node.data();
        const aliasCount = node.connectedEdges('edge[edge_type="alias"]').length;
        return BASE_NODE_SIZE + aliasCount * 2;
      }

      function calculateAliasNodeSize(node) {
        const data = node.data();
        const occurrences = Array.isArray(data.occurrences) ? data.occurrences : [];
        return BASE_NODE_SIZE + (occurrences.length * 2);
      }

      async function loadGraph() {
        try {
          const response = await fetch('/graph-viewmodel?run_path={{ run_path }}');
          if (!response.ok) {
            throw new Error(`Failed to load graph: ${response.status} ${response.statusText}`);
          }

          const graphData = await response.json();

          status.textContent = 'Graph loaded successfully.';

          const cy = cytoscape({
            container: document.getElementById('graph'),
            boxSelectionEnabled: false,
            elements: graphData,
            style: [
              {
                selector: 'node',
                style: {
                  'text-valign': 'center',
                  'text-halign': 'right',
                  'text-margin-x': 1,
                  'shape': 'ellipse',
                  'label': 'data(label)',
                  'color': '#0b0c0c',
                  'font-size': 3,
                }
              },
              {
                selector: 'node[type="entity"]',
                style: {
                  'background-color': '#1d70b8',
                  'width': calculateEntityNodeSize,
                  'height': calculateEntityNodeSize,
                }
              },
              {
                selector: 'node[type="alias"]',
                style: {
                  'background-color': '#f47738',
                  'width': calculateAliasNodeSize,
                  'height': calculateAliasNodeSize,
                }
              },
              {
                selector: 'edge',
                style: {
                  'width': 0.5,
                  'target-arrow-shape': 'vee',
                  'color': '#0b0c0c',
                  'curve-style': 'bezier',
                  'text-rotation': 'autorotate',
                }
              },
              {
                selector: 'edge[edge_type="alias"]',
                style: {
                  'line-color': '#9ca3af',
                  'target-arrow-color': '#9ca3af',
                }
              },
              {
                selector: 'edge[edge_type="relationship"]',
                style: {
                  'label': 'data(label)',
                  'font-size': 3,
                  'line-color': '#a395db',
                  'line-style': 'dashed',
                  'target-arrow-color': '#a395db',
                }
              },
              {
                selector: ':selected',
                style: {
                  'border-width': 0.5,
                  'border-color': '#10b981'
                }
              }
            ],
            layout: {
              name: 'cose',
              fit: true,
              nodeDimensionsIncludeLabels: true,
              componentSpacing: 200,
              nodeRepulsion: function( node ) { return 2000; },
              nodeOverlap: 1,
            }
          });

          cy.on('tap', 'node', (event) => {
            renderNodeDetails(event.target);
          });

          cy.on('tap', (event) => {
            if (event.target === cy) {
              sidebarTitle.textContent = 'No node selected';
              details.innerHTML = '<p>Select a node to view details.</p>';
            }
          });
        } catch (error) {
          status.textContent = error.message;
          details.textContent = 'Unable to display graph.';
          console.error(error);
        }
      }

      loadGraph();
    </script>
  </body>
</html>
