{% extends 'base.html' %}

{% block title %}Visualisations{% endblock %}

{% block content %}
<div class="govuk-body">
  <h1>Visualisations</h1>

  {% if visualisations %}
  <ul>
    {% for v in visualisations %}
    <li>
      <a href="{{ url_for('graph_page', run_path=v.run_path) }}">{{ v.run_path }}</a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>There are no visualisations to show</p>
  {% endif %}
</div>
{% endblock %}
