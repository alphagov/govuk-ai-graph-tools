<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metrics Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/metrics.css') }}" />
  </head>
  <body>
    <div id="root"></div>

    <!-- React Dependencies via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Our React Code -->
    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const runPath = "{{ run_path|e }}";

      {% raw %}
      function MetricsDashboard() {
        const urlParams = new URLSearchParams(window.location.search);
        const initialFilters = urlParams.getAll('q');
        
        const [entities, setEntities] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        
        // Multiple search filters. 0th index is the main top-bar search. 
        const [filters, setFilters] = useState(initialFilters.length > 0 ? initialFilters : [""]);
        
        const [currentPage, setCurrentPage] = useState(1);
        const [pageSize, setPageSize] = useState(10);
        const [selectedEntityId, setSelectedEntityId] = useState(null);
        const [selectedAliasId, setSelectedAliasId] = useState(null);
        const [checkedEntityIds, setCheckedEntityIds] = useState(new Set());

        // Sync URL with filters
        useEffect(() => {
          const url = new URL(window.location);
          url.searchParams.delete('q');
          filters.forEach(f => {
            if (f.trim()) {
              url.searchParams.append('q', f.trim());
            }
          });
          window.history.replaceState({}, '', url);
          setCurrentPage(1);
        }, [filters]);

        // Fetch data
        useEffect(() => {
          fetch(`/graph-viewmodel${runPath ? `?run_path=${encodeURIComponent(runPath)}` : ''}`)
            .then(res => {
              if (!res.ok) throw new Error("Failed to fetch graph data");
              return res.json();
            })
            .then(json => {
              const edges = json.edges || [];
              const nodes = json.nodes || [];

              const nodeMap = {};
              nodes.forEach(n => nodeMap[n.data.id] = n);

              const entityNodes = nodes.filter(n => n.data.type === 'entity');
              const entityMap = {};
              entityNodes.forEach(e => {
                entityMap[e.data.id] = { ...e, aliases: [], totalOccurrences: 0, aliasCount: 0 };
              });

              edges.forEach(edge => {
                if (edge.data.label.startsWith('Alias')) {
                  const { source, target } = edge.data;
                  if (entityMap[source] && nodeMap[target]) {
                    entityMap[source].aliases.push(nodeMap[target]);
                  }
                }
              });

              const processedEntities = Object.values(entityMap).map(entity => {
                let occurrences = 0;
                entity.aliases.forEach(a => {
                  if (a.data.occurrences) {
                    occurrences += a.data.occurrences.length;
                  }
                });
                return {
                  ...entity,
                  totalOccurrences: occurrences,
                  aliasCount: entity.aliases.length
                };
              });

              setEntities(processedEntities);
              setLoading(false);
            })
            .catch(err => {
              console.error(err);
              setError(err.message);
              setLoading(false);
            });
        }, []);

        useEffect(() => {
          if (selectedEntityId) {
            const entity = entities.find(e => e.data.id === selectedEntityId);
            if (entity && entity.aliases.length > 0) {
              if (!selectedAliasId || !entity.aliases.some(a => a.data.id === selectedAliasId)) {
                setSelectedAliasId(entity.aliases[0].data.id);
              }
            } else {
              setSelectedAliasId(null);
            }
          }
        }, [selectedEntityId, entities]);

        const handleExportCSV = () => {
          const targetEntities = checkedEntityIds.size > 0 
            ? filteredEntities.filter(e => checkedEntityIds.has(e.data.id))
            : filteredEntities;
            
          if (!targetEntities || targetEntities.length === 0) return;
          
          const headers = ["ENTITY", "CATEGORY", "ALIASES", "ALIAS COUNT", "OCCURRENCES"];
          const rows = [headers.join(",")];
          
          targetEntities.forEach(entity => {
            const entityName = `"${(entity.data.label || entity.data.id).replace(/"/g, '""')}"`;
            const category = `"${(entity.data.id.split('__')[0] || '').replace(/"/g, '""')}"`;
            const aliasesLabels = entity.aliases.map(a => a.data.label).join("; ");
            const aliases = `"${aliasesLabels.replace(/"/g, '""')}"`;
            const aliasCount = entity.aliasCount;
            const occurrences = entity.totalOccurrences;
            
            rows.push([entityName, category, aliases, aliasCount, occurrences].join(","));
          });
          
          const csvContent = rows.join("\n");
          const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "metrics_export.csv";
          a.click();
          URL.revokeObjectURL(url);
        };

        const updateFilter = (index, val) => {
          const newFilters = [...filters];
          newFilters[index] = val;
          setFilters(newFilters);
        };

        const addFilter = () => {
          setFilters([...filters, ""]);
        };

        const removeFilter = (index) => {
          const newFilters = filters.filter((_, i) => i !== index);
          if (newFilters.length === 0) newFilters.push("");
          setFilters(newFilters);
        };

        const filteredEntities = useMemo(() => {
          const activeQueries = filters.map(f => f.toLowerCase().trim()).filter(f => f.length > 0);
          if (activeQueries.length === 0) return entities;
          
          return entities.filter(e => {
            return activeQueries.every(query => {
              const matchesEntity = (e.data.label || "").toLowerCase().includes(query) || 
                                    e.data.id.toLowerCase().includes(query) ||
                                    e.data.id.split('__')[0].toLowerCase().includes(query);
              const matchesAlias = e.aliases.some(a => (a.data.label || "").toLowerCase().includes(query));
              return matchesEntity || matchesAlias;
            });
          });
        }, [entities, filters]);

        const totalPages = Math.ceil(filteredEntities.length / pageSize);
        const startIndex = (currentPage - 1) * pageSize;
        const paginatedEntities = filteredEntities.slice(startIndex, startIndex + pageSize);

        if (loading) return <div className="loading-overlay">Loading metrics data...</div>;
        if (error) return <div className="loading-overlay" style={{color: 'red'}}>Error: {error}</div>;

        const selectedEntity = entities.find(e => e.data.id === selectedEntityId);
        const selectedAlias = selectedEntity?.aliases.find(a => a.data.id === selectedAliasId);
        const occurrencesForAlias = selectedAlias?.data.occurrences || [];

        return (
          <div className={`dashboard-content ${selectedEntityId ? 'has-selection' : ''}`}>
            
            {/* Top Bar */}
            <div className="top-bar">
              <div className="search-section">
                <div className="search-input-wrapper">
                  <svg className="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                  </svg>
                  <input 
                    type="text" 
                    className="search-bar" 
                    placeholder="Search entities, aliases, or context..." 
                    value={filters[0] || ""}
                    onChange={e => updateFilter(0, e.target.value)}
                  />
                </div>
              </div>
              <div className="actions-section">
                <div className="entity-count">
                  <strong>{filteredEntities.length}</strong> of <strong>{entities.length}</strong> entities
                </div>
                <button className="btn btn-outline">
                  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
                  Columns
                </button>
                <button className="btn btn-success" onClick={handleExportCSV}>
                  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                  Export CSV {checkedEntityIds.size > 0 ? `(${checkedEntityIds.size})` : ''}
                </button>
              </div>
            </div>

            {/* Filters Bar */}
            <div className="filters-bar">
              FILTERS
              {filters.slice(1).map((filterVal, index) => (
                <div key={index + 1} style={{ display: 'flex', alignItems: 'center', gap: '4px', background: 'white', border: '1px solid #e5e7eb', padding: '2px 8px', borderRadius: '4px' }}>
                  <input 
                    type="text" 
                    value={filterVal} 
                    onChange={e => updateFilter(index + 1, e.target.value)} 
                    style={{ border: 'none', outline: 'none', fontSize: '0.875rem', width: '150px' }} 
                    placeholder="Search query..."
                  />
                  <button onClick={() => removeFilter(index + 1)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#dc2626' }}>×</button>
                </div>
              ))}
              <button className="add-filter-btn" onClick={addFilter}>+ Add filter</button>
            </div>

            {/* Master Table */}
            <div className="table-container">
              <table className="metrics-table">
                <thead>
                  <tr>
                    <th style={{ width: '40px', textAlign: 'center' }}>
                      <input 
                        type="checkbox" 
                        checked={paginatedEntities.length > 0 && paginatedEntities.every(e => checkedEntityIds.has(e.data.id))}
                        onChange={(e) => {
                          const newChecked = new Set(checkedEntityIds);
                          if (e.target.checked) {
                            paginatedEntities.forEach(ent => newChecked.add(ent.data.id));
                          } else {
                            paginatedEntities.forEach(ent => newChecked.delete(ent.data.id));
                          }
                          setCheckedEntityIds(newChecked);
                        }}
                      />
                    </th>
                    <th>ENTITY</th>
                    <th>CATEGORY</th>
                    <th>ALIASES</th>
                    <th>ALIAS COUNT</th>
                    <th>OCCURRENCES</th>
                  </tr>
                </thead>
                <tbody>
                  {paginatedEntities.map(entity => {
                    const isSelected = selectedEntityId === entity.data.id;
                    const category = entity.data.id.split('__')[0];
                    return (
                      <tr 
                        key={entity.data.id} 
                        className={isSelected ? 'selected' : ''}
                        onClick={() => setSelectedEntityId(isSelected ? null : entity.data.id)}
                      >
                        <td style={{ textAlign: 'center' }} onClick={e => e.stopPropagation()}>
                          <input 
                            type="checkbox" 
                            checked={checkedEntityIds.has(entity.data.id)}
                            onChange={(e) => {
                              const newChecked = new Set(checkedEntityIds);
                              if (e.target.checked) {
                                newChecked.add(entity.data.id);
                              } else {
                                newChecked.delete(entity.data.id);
                              }
                              setCheckedEntityIds(newChecked);
                            }}
                          />
                        </td>
                        <td>
                          <div className="entity-name">{entity.data.label || entity.data.id}</div>
                          <div className="entity-id">{entity.data.id}</div>
                        </td>
                        <td>
                          <span className="badge badge-category">{category}</span>
                        </td>
                        <td>
                          <div className="aliases-container">
                            {entity.aliases.slice(0, 3).map((alias, idx) => (
                              <span key={idx} className="badge badge-alias">{alias.data.label}</span>
                            ))}
                            {entity.aliases.length > 3 && (
                              <span style={{ fontSize: '0.75rem', color: '#6b7280', alignSelf: 'center' }}>+{entity.aliases.length - 3} more</span>
                            )}
                          </div>
                        </td>
                        <td style={{ textAlign: 'center' }}>{entity.aliasCount}</td>
                        <td style={{ textAlign: 'center' }}>{entity.totalOccurrences}</td>
                      </tr>
                    );
                  })}
                  {paginatedEntities.length === 0 && (
                    <tr>
                      <td colSpan="4" style={{ textAlign: 'center', padding: '32px', color: '#6b7280' }}>
                        No entities match the current filters.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>

            {/* Pagination Controls */}
            {filteredEntities.length > 0 && (
              <div className="pagination-container">
                <div className="pagination-info">
                  Showing {startIndex + 1} to {Math.min(startIndex + pageSize, filteredEntities.length)} of {filteredEntities.length} entities
                </div>
                <div className="pagination-controls">
                  <button 
                    className="btn btn-outline"
                    disabled={currentPage === 1} 
                    onClick={() => setCurrentPage(prev => prev - 1)}
                  >
                    Previous
                  </button>
                  <span className="page-text">Page {currentPage} of {totalPages || 1}</span>
                  <button 
                    className="btn btn-outline"
                    disabled={currentPage >= totalPages} 
                    onClick={() => setCurrentPage(prev => prev + 1)}
                  >
                    Next
                  </button>
                </div>
                <div>
                  <select 
                    className="search-bar"
                    style={{width: 'auto', padding: '6px', fontSize: '0.875rem'}}
                    value={pageSize} 
                    onChange={(e) => { setPageSize(Number(e.target.value)); setCurrentPage(1); }} 
                  >
                    <option value={10}>10 per page</option>
                    <option value={20}>20 per page</option>
                    <option value={50}>50 per page</option>
                  </select>
                </div>
              </div>
            )}

            {/* Detail Pane */}
            {selectedEntityId && selectedEntity && (
              <div className="detail-pane">
                <div className="detail-sidebar">
                  <div className="detail-header">Aliases</div>
                  <div className="detail-content" style={{ overflowY: 'auto' }}>
                    {selectedEntity.aliases.map(alias => (
                      <div 
                        key={alias.data.id} 
                        className={`alias-list-item ${selectedAliasId === alias.data.id ? 'active' : ''}`}
                        onClick={() => setSelectedAliasId(alias.data.id)}
                      >
                        <div className="alias-name">{alias.data.label}</div>
                        <div className="alias-list-count">{(alias.data.occurrences || []).length} occurrences</div>
                      </div>
                    ))}
                    {selectedEntity.aliases.length === 0 && (
                      <div style={{ padding: '16px', color: '#6b7280', fontSize: '0.875rem' }}>No aliases found.</div>
                    )}
                  </div>
                </div>
                <div className="detail-main">
                  <div className="detail-header">
                    Occurrences for: {selectedAlias?.data.label || 'None'}
                  </div>
                  <div className="detail-content">
                    {selectedAlias ? (
                      <div className="occurrences-list">
                        {occurrencesForAlias.map((occ, idx) => (
                          <div key={idx} className="occurrence-card">
                            <div dangerouslySetInnerHTML={{ __html: occ.context }}></div>
                            {occ.link && (
                              <a href={occ.link} target="_blank" rel="noopener noreferrer" className="occurrence-link">
                                View on GOV.UK ↗
                              </a>
                            )}
                          </div>
                        ))}
                        {occurrencesForAlias.length === 0 && (
                          <div style={{ color: '#6b7280' }}>No occurrences found for this alias.</div>
                        )}
                      </div>
                    ) : (
                      <div style={{ color: '#6b7280', padding: '16px' }}>Select an alias to view occurrences.</div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<MetricsDashboard />);
      {% endraw %}
    </script>
  </body>
</html>
